name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --no-project python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
          echo "tag and package version agree: $version"
      - name: Build
        run: uv build
      # A tag is the moment the pack stops being a draft: the per-host layouts an agent installs
      # have to be exactly what the canonical skills render, not what someone last generated.
      - name: Verify the skill pack matches its sources
        run: uv run --no-project python tools/export_skills.py --check
      - name: Package the agent skills
        run: |
          set -euo pipefail
          pack="$(mktemp -d)"
          mkdir -p "$pack/skills/hosts"
          cp -R skills/hosts/. "$pack/skills/hosts/"
          cp -R skills/README.md "$pack/skills/README.md" 2>/dev/null || true
          cp LICENSE "$pack/LICENSE"
          # The archive root carries skills/hosts/, which is where install-skills.sh looks first.
          tar -czf dist/jeval-skills.tar.gz -C "$pack" .
          tar -tzf dist/jeval-skills.tar.gz | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  attach:
    name: attach distributions to the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # The release asset is the install path: the `jeval` name on PyPI belongs to another project,
      # so a tag has to produce something installable on its own.
      #
      # `-R` because there is no checkout here: gh infers the repository from a git remote, and
      # without one it fails with "fatal: not a git repository" after uploading nothing.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          if gh release view "$GITHUB_REF_NAME" -R "$repo" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* -R "$repo" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* -R "$repo" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
      # An upload that exited 0 is not an asset someone can download, so read it back. The names are
      # checked one by one on purpose: `grep .tar.gz` would be satisfied by the skills archive even
      # if the sdist never made it, which is the failure this step exists to catch.
      - name: Verify the release carries every asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tag is the version: the build job already proved tag == pyproject version, and this
          # job has no checkout to read pyproject.toml from.
          version="${GITHUB_REF_NAME#v}"
          listed="$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$listed"
          for asset in "jeval_cli-${version}-py3-none-any.whl" "jeval_cli-${version}.tar.gz" "jeval-skills.tar.gz"; do
            echo "$listed" | grep -qx "$asset" || {
              echo "missing release asset: $asset" >&2
              exit 1
            }
          done
