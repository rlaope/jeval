[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jeval-cli"
version = "0.1.5"
description = "Measure the calibration of probabilistic AI classifiers and derive cost-optimal human/AI routing thresholds."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "jeval contributors" }]
keywords = ["calibration", "reliability", "ece", "confidence", "classification", "human-in-the-loop"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/rlaope/jeval"
Issues = "https://github.com/rlaope/jeval/issues"

[project.scripts]
jeval = "jeval.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["jeval"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Markup literals (HTML attributes, SVG path data) are not meaningfully breakable, and the
# chart modules import the SVG primitives as `S` because `S.dot(...)` reads better than a
# fully spelled module name repeated hundreds of times in geometry code.
"jeval/report/*.py" = ["E501", "N812"]
"jeval/report/charts/*.py" = ["E501", "N812"]
"tests/*" = ["E501"]

[tool.mypy]
# numpy's bundled stubs use PEP 695 syntax, which mypy can only parse with a 3.12+ target
# version. Runtime support for 3.10/3.11 is proven by the CI test matrix instead, where a
# real incompatibility fails a test rather than a stub parse.
python_version = "3.12"
strict = true
files = ["jeval"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["jeval"]
